# These are my base versions for tools that I use regularly
[tools]
pnpm = "latest"
go = "latest"
rust = "latest"
"github:neovim/neovim" = "latest"
erlang = "latest"
rebar = "latest"
act = "latest"
hugo = "latest"
python = "latest"
node = "latest"
gleam = "latest"
terraform = "latest"
opentofu = "latest"
deno = "latest"
rust-analyzer = "latest"
just = "latest"
usage = "latest"
"aqua:go-task/task" = "latest"
opam = "latest"
"aqua:tinygo-org/tinygo" = "latest"
elm = "latest"
kotlin = { version = "latest", asset_pattern = "kotlin-compiler-*.zip", bin_path = "kotlinc/bin" }

[env]

[settings]
idiomatic_version_file_enable_tools = ["node"]

[settings.python]
compile = true
