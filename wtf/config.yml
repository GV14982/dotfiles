wtf:
  colors:
    background: default
    border:
      focusable: green
      focused: orange
      normal: white
    checked: yellow
    highlight:
      fore: black
      back: gray
    rows:
      even: yellow
      odd: white
  grid:
    columns: [32, 22, 40, 30, 10]
    rows: [9, 5, 10, 6, 3]
  refreshInterval: 1
  openFileUtil: "open"
  mods:
    # You can have multiple widgets of the same type.
    # The "key" is the name of the widget and the type is the actual
    # widget you want to implement.
    weather:
      type: prettyweather
      title: Weather
      enabled: true
      position:
        top: 0
        left: 0
        height: 1
        width: 1
      city: Philadelphia
      refreshInterval: 5m
      unit: u
      view: 0
    digital_clock:
      focusable: false
      title: Clock
      type: cmdrunner
      enabled: true
      pty: true
      cmd: /home/gvqz/clock.fish
      position:
        top: 1
        left: 1
        height: 1
        width: 1
      refreshInterval: 1
    ical:
      type: ical
      title: Calendar
      enabled: true
      sources:
        test: https://pastebin.com/raw/tn92LAGg
      position:
        top: 0
        left: 2
        height: 5
        width: 1
